[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orix"
version = "0.1.0"
description = "Orix CLI scaffolder for Django, FastAPI, Next.js, React, and Flutter."
readme = "README.md"
authors = [
  { name = "Kryonara", email = "support@kryonara.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cli", "scaffolder", "django", "fastapi", "next.js", "react", "flutter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.1.0",
  "questionary>=1.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "black>=23.0.0",
  "flake8>=6.0.0",
  "mypy>=1.0.0",
]
publish = [
  "build>=0.10.0",
  "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/kryonara/orix"
Documentation = "https://github.com/kryonara/orix/blob/main/README.md"
Repository = "https://github.com/kryonara/orix.git"
Issues = "https://github.com/kryonara/orix/issues"

[project.scripts]
orix = "orix:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["orix"]

[tool.setuptools.package-data]
core = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=core --cov=orix --cov-report=term-missing"
